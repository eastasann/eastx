# 全 PR と main への push で走る検査（docs/04_deployment-procedure.md 2章）。デプロイはしない。
# deploy/*/version を変えた PR では昇格の確認を走らせ、それだけを変えた PR ではコードの検査を省く。
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 明示した shell: bash は -eo pipefail で走る
defaults:
  run:
    shell: bash

# PR は新しい push で古い実行を取り消す。main は SHA ごとに分け、昇格の候補になる SHA の結果を残す
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      promotion-envs: ${{ steps.diff.outputs.promotion-envs }}
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != pull_request ]; then
            echo 'code=true' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # PR のチェックアウトは base との merge コミットなので、HEAD^1 との差分が PR の変更
          files=$(git diff --name-only HEAD^1 HEAD)
          envs=$(printf '%s\n' "$files" | sed -nE 's#^deploy/(staging|production)/version$#\1#p' | tr '\n' ' ')
          others=$(printf '%s\n' "$files" | grep -vE '^deploy/(staging|production)/version$' || true)
          echo "promotion-envs=${envs% }" >>"$GITHUB_OUTPUT"
          if [ -n "$others" ]; then echo 'code=true' >>"$GITHUB_OUTPUT"; else echo 'code=false' >>"$GITHUB_OUTPUT"; fi

  promotion-check:
    needs: changes
    if: needs.changes.outputs.promotion-envs != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 祖先の判定と staging の過去の値に main の全履歴が要る
          fetch-depth: 0
          persist-credentials: false
      - env:
          ENVS: ${{ needs.changes.outputs.promotion-envs }}
        # 判定は main のスクリプトで行う（PR がスクリプトを書き換えて自分の確認を通すことを防ぐ）。
        # ENVS は空白区切りの環境名なので、引用せずに分割して渡す
        run: git show origin/main:scripts/promotion-check.sh | bash -s -- $ENVS --main origin/main

  ci:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Prepare .dev.vars
        # wrangler types は .dev.vars のキーを Env 型に含めるので、最初の make（gen → typecheck）より
        # 前に置かないとローカルと違う Env 型が生成されて typecheck が落ちる。E2E の管理者のセッション
        # （tests/e2e/fixtures.ts の login({ admin: true })）も .dev.vars の ADMIN_GITHUB_USER_ID の
        # 管理者として作られる。GitHub には行かないので、実在しない固定の ID でよい
        run: |
          cp .dev.vars.example .dev.vars
          sed -i 's/^ADMIN_GITHUB_USER_ID=.*/ADMIN_GITHUB_USER_ID=1000001/' .dev.vars
      - run: make lint
      - run: make typecheck
      - run: make test
      - run: make build
      - run: bunx playwright install --with-deps chromium
      - run: make e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: |
            test-results/
            .lighthouseci/
          retention-days: 7
          if-no-files-found: ignore
